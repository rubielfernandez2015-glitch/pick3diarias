<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAB · OCR jugadas (prueba local)</title>
<style>
  :root{--bg:#0f1419;--b2:#1a2129;--b3:#222c36;--br:#33404d;--tx:#e6edf3;--t2:#9fb0c0;--t3:#6b7c8c;--v:#1a7a4a;--vc:#25a060;--rc:#e05555;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:760px;margin:0 auto;}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--t3);font-size:12px;margin-bottom:16px}
  label{display:block;font-size:12px;color:var(--t2);margin:12px 0 4px}
  input,textarea,select,button{width:100%;background:var(--b3);border:1px solid var(--br);border-radius:8px;padding:10px 12px;color:var(--tx);font-size:14px;font-family:inherit;}
  textarea{resize:vertical;min-height:70px;font-family:ui-monospace,monospace;font-size:13px;}
  button{background:linear-gradient(135deg,var(--v),var(--vc));border:none;font-weight:700;cursor:pointer;margin-top:12px;}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .card{background:var(--b2);border:1px solid var(--br);border-radius:12px;padding:14px;margin-top:14px}
  img#preview{max-width:100%;border-radius:10px;margin-top:10px;display:none}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--b3);border:1px solid var(--br);border-radius:8px;padding:10px;font-size:13px;margin:0}
  .ok{color:var(--vc)}.bad{color:var(--rc)}
  .pill{display:inline-block;background:var(--b3);border:1px solid var(--br);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--t2);margin:2px 4px 2px 0}
  .note{font-size:11px;color:var(--t3);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
  <h1>🧪 LAB · OCR de jugadas a lápiz</h1>
  <div class="sub">Prueba LOCAL para medir si la IA lee bien las fotos. No toca tu app ni la base de datos. La key se usa solo aquí y no se guarda.</div>

  <div class="card">
    <label>1) API key de Google Gemini (gratis · ai.google.dev → "Get API key")</label>
    <input id="key" type="password" placeholder="Pega aquí tu key gratis (solo local)">
    <label>Modelo</label>
    <select id="model">
      <option value="gemini-2.5-flash">gemini-2.5-flash (rápido, recomendado)</option>
      <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      <option value="gemini-2.5-pro">gemini-2.5-pro (más preciso, más lento)</option>
      <option value="gemini-1.5-flash">gemini-1.5-flash</option>
    </select>
    <div class="note">La key gratis se guarda en tu navegador local (localStorage) para no repegar. Bórrala con el botón de abajo cuando termines.</div>
  </div>

  <div class="card">
    <label>2) Foto de la jugada (toma con cámara o sube archivo)</label>
    <input id="file" type="file" accept="image/*" capture="environment">
    <img id="preview" alt="preview">
    <div class="note" id="imginfo"></div>
  </div>

  <div class="card">
    <label>3) Instrucción para la IA (editable — la afinamos con tus ejemplos)</label>
    <textarea id="prompt" style="min-height:170px"></textarea>
  </div>

  <button id="go" disabled>🔍 Reconocer jugada</button>

  <div class="card" id="out" style="display:none">
    <label>Texto que devolvió la IA (esto caería en tu caja de "Texto")</label>
    <pre id="raw"></pre>
    <label style="margin-top:12px">Cómo lo interpretaría tu app (reglas reales de parsearTexto)</label>
    <pre id="parsed"></pre>
    <div class="note" id="timing"></div>
  </div>

  <button id="clearkey" style="background:#3a2530;margin-top:18px">🗑️ Borrar la key guardada</button>

<script>
const DEFAULT_PROMPT = `Eres un experto leyendo apuestas de la bolita (lotería) cubana en fotos, hojas manuscritas y mensajes de WhatsApp.

OBJETIVO: extraer TODOS los números jugados (de 00 a 99) con su monto y devolver UNA línea por cada par número-monto, en este formato EXACTO:

NN-MONTO

(NN = número de dos dígitos 00-99; MONTO = cantidad, con punto si tiene decimales; SIEMPRE con un guion; una línea por par; sin texto extra ni encabezados.)

REGLAS GENERALES (muy importantes):
- IGNORA los NOMBRES de personas/clientes (ej. Pedro, Tomás, Bordo, Mar, Alana). No son jugadas.
- IGNORA encabezados/referencias de FECHA (ej. "30/5", "31-Dic", "día 30", "Noche", "Tarde"). PERO un número que tiene su monto o aportes (ej. "30-240" o "30 = 30-15") SÍ es una jugada: inclúyelo. Solo ignora un número si está suelto como fecha, sin monto.
- IGNORA los TOTALES (la suma de todo, normalmente DEBAJO o al final de las jugadas, a veces con "TOTAL" o en recuadro). OJO: un número en CÍRCULO o junto a una raya NO es total: es el MONTO de esa jugada o grupo.
- NUNCA sumes tú los montos. Si un número recibe varios montos, emite VARIAS líneas con el mismo número; el sistema suma. Así no hay errores de cuenta.
- Lee el monto COMPLETO con todos sus dígitos: un 10 no es 1, un 100 no es 10.
- Expande SIEMPRE grupos, terminales y rangos a números individuales 00-99.

FORMATOS (expande todo a líneas NN-MONTO):
1) NÚMERO-MONTO directo: "49-30" -> 49-30 ; "50-1350" -> 50-1350. El monto puede venir como número pequeño al lado/arriba ("14 |50" -> 14-50) o entre paréntesis o círculo ("20=(100)" o "20 (100)" -> 20-100).
2) HOJA POR FILAS / pre-numerada: el número está al INICIO de la fila (puede venir IMPRESO o a máquina) y los montos escritos en ESA fila pertenecen a ESE número, AUNQUE NO haya "=" ni guion entre el número y los montos. Ej: fila "4" con "50-550-200" -> 04-50, 04-550, 04-200 (todos son del 04; si hay varios montos, una línea por cada uno). Filas SIN monto = sin jugada (ignorar). El "4" es el número 04; el "100" del final de la hoja es el 00.
3) GRUPO CON MONTO COMÚN (raya/flecha): una RAYA o FLECHA (vertical o larga) que corre junto a una LISTA de números los AGRUPA; el monto escrito JUNTO a esa raya (arriba, al lado o en círculo) aplica a TODOS los números del grupo. En una columna puede haber VARIOS grupos divididos por rayas, cada uno con su monto. También sirve "de 50" o un monto escrito una sola vez para el grupo. Repite cada número del grupo con su monto.
   - Asteriscos (WhatsApp): "44*22*66*77*99 de 50" -> 44-50,22-50,66-50,77-50,99-50.
   - Dígitos pegados en pares: "10203040 de 100" -> 10-100,20-100,30-100,40-100.
4) RANGO: con la palabra "al", o con guion cuando hay "= monto". "01 al 10 = 40" -> 01-40,02-40,...,10-40 ; "20-29 = 50" -> 20-50,21-50,...,29-50. (El guion es RANGO solo si los dos lados son números y hay "= monto" o "al"; un "número-monto" suelto NO es rango.)
5) TERMINAL ("afuera"/"terminal") SOLO cuando lo dice explícito: un número NUNCA se expande a terminal por sí solo; en una hoja que lista números (01..99) cada uno es ESE número individual con su(s) monto(s). Expande a terminal solo si dice "afuera" o "terminal", o es un rango de terminales ("10-00"). "0 afuera de 150" -> 00-150,10-150,...,90-150 ; "terminal 2 de 100" -> 02-100,12-100,...,92-100.
6) UN NÚMERO CON VARIOS APORTES: "01 = 35-10-20-25-200" -> 01-35,01-10,01-20,01-25,01-200 (una línea por aporte; el sistema suma). Si una terminal recibe varios montos ("terminal 2 -> 100 750"), por cada número de la terminal emite una línea por cada monto (02-100, 02-750, 12-100, 12-750, ... , 92-100, 92-750).

DUDAS:
- Si una cifra está borrosa o dudosa, ponla igual y agrega " ?" al final del renglón.
- No inventes números que no veas. Si no hay jugadas legibles, responde solo: (sin jugadas)`;

const $ = id => document.getElementById(id);
$('prompt').value = DEFAULT_PROMPT;
$('key').value = localStorage.getItem('lab_gemini_key') || '';

let imgB64 = null, imgMime = 'image/jpeg';

function refreshGo(){ $('go').disabled = !(imgB64 && $('key').value.trim()); }
$('key').addEventListener('input', ()=>{ localStorage.setItem('lab_gemini_key', $('key').value.trim()); refreshGo(); });
$('clearkey').onclick = ()=>{ localStorage.removeItem('lab_gemini_key'); $('key').value=''; refreshGo(); alert('Key borrada de este navegador.'); };

// Comprime la imagen a máx 1280px lado mayor, JPEG ~0.75 (menos datos = más rápido/barato)
$('file').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 1600;
    let {width:w, height:h} = img;
    if (Math.max(w,h) > max){ const s = max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    const dataUrl = c.toDataURL('image/jpeg', 0.82);
    imgMime = 'image/jpeg';
    imgB64 = dataUrl.split(',')[1];
    $('preview').src = dataUrl; $('preview').style.display='block';
    $('imginfo').textContent = `Comprimida a ${w}×${h}px · ~${Math.round(imgB64.length*0.75/1024)} KB`;
    refreshGo();
  };
  img.src = URL.createObjectURL(f);
};

// Mismas reglas que separarLineaJugada/esLineaJugada de la app real
function separarLineaJugada(l){
  const norm = l.trim().replace(/\s+de\s+/i,'-').replace(/\s+con\s+/i,'-')
    .replace(/_/g,'-').replace(/\s*-\s*/g,'-');
  const idx = norm.indexOf('-'); if(idx<0) return null;
  const pick = parseInt(norm.substring(0,idx).trim());
  const monto = parseFloat(norm.substring(idx+1).trim().replace(',','.'));
  if(isNaN(pick)||pick<0||pick>99) return null;
  if(isNaN(monto)||monto<0.5) return null;
  return { pick: String(pick).padStart(2,'0'), monto };
}

function mostrarParseo(txt){
  const lineas = txt.split('\n').map(l=>l.trim()).filter(Boolean);
  const out = []; let total=0, okN=0;
  for(const l of lineas){
    if(/sin jugadas/i.test(l)) { out.push('(la IA no vio jugadas)'); continue; }
    const dudosa = /\?/.test(l);
    const seg = separarLineaJugada(l.replace(/\?/g,''));
    if(seg){ okN++; total+=seg.monto; out.push(`✓ Pick ${seg.pick} · ${seg.monto.toFixed(2)} CUP${dudosa?'  ⚠️ revisar':''}`); }
    else out.push(`✗ no entendí: "${l}"`);
  }
  out.push(`\n— ${okN} jugada(s) válida(s) · total ${total.toFixed(2)} CUP`);
  return out.join('\n');
}

$('go').onclick = async () => {
  const key = $('key').value.trim(), model = $('model').value;
  if(!imgB64 || !key) return;
  $('go').disabled = true; $('go').textContent = '⏳ Leyendo...';
  $('out').style.display='block'; $('raw').textContent='...'; $('parsed').textContent='';
  const t0 = performance.now();
  try{
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
    const body = {
      contents: [{ parts: [ {text: $('prompt').value}, {inline_data:{mime_type:imgMime, data:imgB64}} ] }],
      generationConfig: { temperature: 0 }
    };
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ $('raw').innerHTML = '<span class="bad">Error '+r.status+': '+(j.error?.message||JSON.stringify(j))+'</span>'; $('go').disabled=false; $('go').textContent='🔍 Reconocer jugada'; return; }
    const txt = j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || '(respuesta vacía)';
    $('raw').textContent = txt;
    $('parsed').textContent = mostrarParseo(txt);
    $('timing').textContent = `Tardó ${((performance.now()-t0)/1000).toFixed(1)} s · modelo ${model}`;
  }catch(err){
    $('raw').innerHTML = '<span class="bad">Falló la llamada: '+err.message+'</span>';
  }
  $('go').disabled=false; $('go').textContent='🔍 Reconocer jugada';
};
</script>
</body>
</html>
